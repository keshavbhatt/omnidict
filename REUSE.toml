version = 1
SPDX-PackageName = "Omnidict"
SPDX-PackageSupplier = "Keshav Bhatt <connect@ktechpit.com>"
SPDX-PackageDownloadLocation = "https://github.com/keshavbhatt/omnidict"

# Everything is GPL-3.0-or-later except the licensing module below.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The licensing module: account, licence, evaluation and allowance code.
# Reserved from milestone M3 onward; these paths do not exist yet in this scaffold.
[[annotations]]
path = [
    "app/src/modules/AccountAndLicense/**",
    "app/src/services/licensing/**",
    "app/src/core/licensing/**"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Keshav Bhatt (Ktechpit)"
SPDX-License-Identifier = "LicenseRef-Ktechpit-Licensing-Module"

# UI glyphs from Lucide (ISC); the ones Lucide took from Feather are also MIT.
# The full notice ships next to them in app/src/resources/icons/ui/LICENSE.
[[annotations]]
path = "app/src/resources/icons/ui/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Lucide Icons and Contributors"
SPDX-License-Identifier = "ISC"

[[annotations]]
path = [
    "app/src/resources/icons/ui/alert.svg",
    "app/src/resources/icons/ui/back.svg",
    "app/src/resources/icons/ui/check.svg",
    "app/src/resources/icons/ui/down.svg",
    "app/src/resources/icons/ui/download.svg",
    "app/src/resources/icons/ui/forward.svg",
    "app/src/resources/icons/ui/info.svg",
    "app/src/resources/icons/ui/more.svg",
    "app/src/resources/icons/ui/power.svg",
    "app/src/resources/icons/ui/search.svg",
    "app/src/resources/icons/ui/trash.svg",
    "app/src/resources/icons/ui/x.svg"
]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Lucide Icons and Contributors", "2013-present Cole Bemis"]
SPDX-License-Identifier = "ISC AND MIT"

# The mocks embed Lucide glyph paths in their helper script.
[[annotations]]
path = "DOCS/mocks/mock.js"
precedence = "override"
SPDX-FileCopyrightText = ["2026 Keshav Bhatt (Ktechpit)", "2026 Lucide Icons and Contributors"]
SPDX-License-Identifier = "GPL-3.0-or-later AND ISC"
