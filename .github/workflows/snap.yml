# Builds the snap on GitHub's CI for both architectures (the snap is never built on a
# developer machine). Publishing to the store is opt-in: set the repo variable
# PUBLISH_TO_STORE=true and the SNAPCRAFT_STORE_CREDENTIALS secret; pushes on main then go
# to edge and version tags (v*) to candidate. Promoting to stable is done by hand.
name: snap

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/src/**'
      - 'app/cmake/**'
      - 'app/CMakeLists.txt'
      - 'app/dist/**'
      - 'snap/**'
      - '.github/workflows/snap.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Build snap (${{ matrix.arch }})
        uses: snapcore/action-build@v1
        id: build

      - name: Publish to the Snap Store
        if: >-
          vars.PUBLISH_TO_STORE == 'true' && github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'candidate' || 'edge' }}
