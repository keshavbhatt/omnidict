# Tests and lint for both halves of the monorepo. The pipeline job builds the
# sample bundle that the app job's C++ tests read, so the round trip between
# the two is checked on every push.
# The snap workflow from the kit arrives with packaging (M5).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Same majors as the development machines; Ubuntu's own packages are older
  # and check differently.
  CLANG_FORMAT_VERSION: "22.1.1"
  CLANG_TIDY_VERSION: "22.1.8"

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5

      - name: ICU headers for PyICU
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: pipeline

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build the sample bundle
        run: make fixture

      # Handed to the app job below, whose C++ tests read what the pipeline wrote: a
      # hand-off between jobs, not a download, so it is kept one day only.
      - uses: actions/upload-artifact@v4
        with:
          name: sample-en-bundle
          path: pipeline/out/sample-en/dict.sqlite
          if-no-files-found: error
          retention-days: 1

  app:
    needs: pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: KDE Qt SDK and runtime snaps
        run: |
          sudo snap install kde-qt6-core24-sdk
          sudo snap install kf6-core24
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build shellcheck

      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v4
        with:
          name: sample-en-bundle
          path: pipeline/out/sample-en

      - name: Build with warnings as errors
        env:
          OMNIDICT_CMAKE_ARGS: "-DOMNIDICT_BUILD_TESTS=ON -DOMNIDICT_WERROR=ON"
        run: scripts/dev-build.sh

      - name: Test
        run: scripts/dev-run.sh --ctest

      - name: clang-format
        run: |
          find app/src app/tests -name '*.cpp' -o -name '*.h' \
            | xargs uvx --from "clang-format==${CLANG_FORMAT_VERSION}" clang-format --dry-run --Werror

      - name: clang-tidy
        run: |
          # *_windows.cpp builds on Windows only, so this compile database does not list it.
          find app/src app/tests -name '*.cpp' ! -name '*_windows.cpp' \
            | xargs uvx --from "clang-tidy==${CLANG_TIDY_VERSION}" clang-tidy -p build --quiet --warnings-as-errors='*'

      - name: shellcheck
        run: shellcheck -x scripts/*.sh

  # The Microsoft Store build (ADR-022), as PixelFx builds its own: MSVC, Qt from download.qt.io,
  # SQLite, ICU and zstd from vcpkg; then the MSIX packages.
  windows:
    needs: pipeline
    runs-on: windows-2022
    env:
      QT_VERSION: "6.11.2"
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: sample-en-bundle
          path: pipeline/out/sample-en

      - name: vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # vcpkg at app/vcpkg.json's baseline, under a name of its own: the MSVC environment sets
      # VCPKG_ROOT to Visual Studio's copy.
      - name: vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content app/vcpkg.json | ConvertFrom-Json).'builtin-baseline'
          $root = "$env:RUNNER_TEMP/vcpkg"
          git clone --quiet https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout --quiet $baseline
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          "OMNIDICT_VCPKG=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      # aqtinstall cannot read Qt 6.11's per-compiler Windows repository yet; fetch-qt.py
      # reads it and checks every archive's SHA-1.
      - name: Qt
        shell: pwsh
        run: |
          $prefix = python scripts/ci/fetch-qt.py --host windows_x86 --version $env:QT_VERSION `
            --compiler msvc2022_64 --modules qtbase qtsvg qttools --dest C:/Qt
          "CMAKE_PREFIX_PATH=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$prefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: >
          cmake -S app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:OMNIDICT_VCPKG/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DOMNIDICT_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        shell: pwsh
        env:
          # The offscreen platform reads fonts from a folder; the system's fonts give the text
          # the sizes it has on Windows.
          QT_QPA_FONTDIR: C:/Windows/Fonts
        run: |
          $env:PATH = "$PWD/build/vcpkg_installed/x64-windows/bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      - name: Package (MSIX)
        shell: pwsh
        run: scripts/ci/package-windows.ps1 -Build build -Out dist

      - uses: actions/upload-artifact@v4
        with:
          name: omnidict-windows-msix
          path: dist/
          retention-days: 14

  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5
