<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="odCover" x1="0" y1="20" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="odBadge" x1="0" y1="58" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ffa348"/>
    </linearGradient>
  </defs>
  <!-- back cover: the book's thickness, not a shadow -->
  <rect x="16" y="24" width="96" height="88" rx="12" fill="#1a5fb4"/>
  <!-- page block showing under the front cover -->
  <rect x="24" y="92" width="84" height="14" rx="4" fill="#f6f5f4"/>
  <rect x="24" y="98" width="84" height="3" fill="#c0bfbc"/>
  <!-- front cover with a spine band -->
  <rect x="16" y="20" width="96" height="78" rx="12" fill="url(#odCover)"/>
  <path d="M28 20 h8 v78 h-8 a12 12 0 0 1 -12 -12 v-54 a12 12 0 0 1 12 -12 z" fill="#1c71d8"/>
  <!-- title lines on the cover -->
  <rect x="46" y="36" width="50" height="8" rx="4" fill="#ffffff"/>
  <rect x="46" y="52" width="26" height="8" rx="4" fill="#ffffff" fill-opacity="0.75"/>
  <!-- lookup badge: ring in cover colour, side, face, magnifier -->
  <circle cx="88" cy="77" r="23" fill="#3584e4"/>
  <circle cx="88" cy="80" r="20" fill="#c64600"/>
  <circle cx="88" cy="77" r="20" fill="url(#odBadge)"/>
  <circle cx="85" cy="74" r="8" fill="none" stroke="#1a5fb4" stroke-width="5"/>
  <path d="M91 80 L97 86" stroke="#1a5fb4" stroke-width="6" stroke-linecap="round"/>
</svg>
